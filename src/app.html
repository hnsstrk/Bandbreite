<!doctype html>
<html lang="de" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<!-- PWA Meta Tags -->
		<meta name="description" content="RF/Microwave frequency calculations and visualizations for engineers and radio enthusiasts" />
		<meta name="theme-color" content="#3b82f6" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#1e40af" media="(prefers-color-scheme: dark)" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />

		<!-- Apple PWA Meta Tags -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Bandbreite" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192x192.png" />

		<!-- Microsoft Tiles -->
		<meta name="msapplication-TileColor" content="#3b82f6" />
		<meta name="msapplication-TileImage" content="%sveltekit.assets%/icons/icon-144x144.png" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>

		<!-- Service Worker Registration -->
		<script>
			if ('serviceWorker' in navigator) {
				window.addEventListener('load', () => {
					navigator.serviceWorker.register('/service-worker.js')
						.then(registration => {
							console.log('SW registered:', registration.scope);
						})
						.catch(error => {
							console.log('SW registration failed:', error);
						});
				});
			}
		</script>
	</body>
</html>
