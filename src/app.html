<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Muss vor dem Anti-FOUC-Skript stehen: das Skript setzt den Wert
		     passend zum Theme und findet das Element sonst nicht. -->
    <meta name="theme-color" content="#f8fafc" />

    <!--
			Anti-FOUC: setzt die .dark-Klasse noch vor dem ersten Rendern.
			Muss blockierend und vor allen Stylesheets stehen, sonst blitzt
			bei jedem Kaltstart das falsche Theme auf.
			Gespeicherte Werte: 'light' | 'dark' | 'system' (bzw. kein Wert).
		-->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0f172a' : '#f8fafc');
        } catch (e) {
          /* localStorage kann blockiert sein — dann bleibt das helle Theme */
        }
      })();
    </script>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bandbreite" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192x192.svg" />

    <!-- Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#3b82f6" />
    <meta name="msapplication-TileImage" content="%sveltekit.assets%/icons/icon-144x144.svg" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/service-worker.js')
            .then((registration) => {
              console.log('SW registered:', registration.scope);
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
